name: Release

# Publishes on a version tag (e.g. v0.1.0). Requires repo secrets:
#   NPM_TOKEN  — npm automation token (publishes @revizorro/cli)
#   VSCE_PAT   — Azure DevOps PAT (publishes the VS Code extension)
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test

      # CLI → npm
      - run: npm publish -w packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Extension → VS Code Marketplace
      - run: npm i -g @vscode/vsce
      - run: vsce publish --no-dependencies -p "$VSCE_PAT"
        working-directory: packages/extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
