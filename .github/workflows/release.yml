name: Release

# Automated release on push to main (semantic-release, conventional commits).
# Publishes @revizorro/cli to npm and the extension to the VS Code Marketplace.
# Required repo secrets:
#   NPM_TOKEN  — npm automation token (publishes @revizorro/cli)
#   VSCE_PAT   — Azure DevOps PAT with Marketplace > Manage (publishes the extension)
#   (GITHUB_TOKEN is provided automatically)
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip semantic-release's own chore(release): version commit.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Build first — lint resolves @revizorro/* through dist/ (see ci.yml).
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx semantic-release
