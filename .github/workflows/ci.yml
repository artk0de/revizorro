name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: lint and typecheck resolve @revizorro/* through each
      # package's dist/, so running them on an unbuilt tree reports every
      # cross-package type as `any` instead of checking it.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck -w packages/extension
      - run: npm test
